[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eps-data-workflows"
version = "0.1.0"
description = "Refactored EPS resequencing and genome-processing workflow renderers"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mutation-rate = ["scipy>=1.9"]
hic = ["cooler>=0.9", "cooltools>=0.6", "matplotlib>=3.6", "numpy>=1.23"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
